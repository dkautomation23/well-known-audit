name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# The default token can write; a build and a test run only need to read.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: node --test "dist/test/**/*.test.js"

      # Fuzzing runs here rather than through ClusterFuzzLite, which supports
      # c, c++, go, rust, python, jvm and swift - not JavaScript. Two commits
      # went into arguing with its sanitizer setting before anyone checked
      # whether the language was on the list at all.
      #
      # Sixty seconds is not a fuzzing campaign. It is enough to catch the
      # target failing to build and the obvious regression, on every push,
      # which is more than a workflow that can never pass.
      - name: Fuzz the parsers for a minute
        run: |
          mkdir -p fuzz/corpus
          npx jazzer fuzz/parse.fuzz.js fuzz/corpus fuzz/seeds --sync -- -max_total_time=60
