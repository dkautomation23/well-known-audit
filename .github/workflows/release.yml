name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A tag is the release: this builds it, proves it, attaches the tarball and
# publishes it to npm through trusted publishing - no token anywhere.
#
# Nothing is writable by default. The one job that needs to write asks for it
# itself, so a step added to this file later starts read-only instead of
# inheriting the right to push to the repository.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach the tarball to the release
      id-token: write      # sign the provenance
      attestations: write  # record it against the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5
      - run: npm ci
      - run: npm run build
      - run: node --test "dist/test/**/*.test.js"
      - name: Pack
        run: npm pack --pack-destination .
      - name: Attest that this artefact came from this workflow
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.tgz"
      - name: Attach the tarball to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: "*.tgz"
          generate_release_notes: true

      # Publishing needs no token: npm trusts this workflow through OIDC, which
      # is configured once on the package's page. The identity lives for the
      # length of the job and cannot be copied out of it.
      - name: Publish to npm
        run: npm publish

