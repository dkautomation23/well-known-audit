name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A tag is the release: this builds it, proves it, attaches the tarball and
# publishes it to npm through trusted publishing - no token anywhere.
permissions:
  contents: write
  id-token: write      # sign the provenance
  attestations: write  # record it against the repository

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5
      - run: npm ci
      - run: npm run build
      - run: node --test "dist/test/**/*.test.js"
      - name: Pack
        run: npm pack --pack-destination .
      - name: Attest that this artefact came from this workflow
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.tgz"
      - name: Attach the tarball to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: "*.tgz"
          generate_release_notes: true

      # Publishing needs no token: npm trusts this workflow through OIDC, which
      # is configured once on the package's page. The identity lives for the
      # length of the job and cannot be copied out of it.
      - name: Publish to npm
        run: npm publish

